<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Session lifecycle as observed in the lab</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- create -->
  <text x="30" y="40" font-size="13" fill="#111827" font-family="Consolas, Menlo, monospace">sessions.create</text>
  <line x1="100" y1="48" x2="140" y2="126" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- idle and running -->
  <rect x="80" y="130" width="190" height="80" rx="40" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="175" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">idle</text>
  <text x="175" y="188" text-anchor="middle" font-size="12" fill="#065f46">waiting for input</text>

  <rect x="520" y="130" width="190" height="80" rx="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="615" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">running</text>
  <text x="615" y="188" text-anchor="middle" font-size="12" fill="#1e3a8a">runtime is billed</text>

  <line x1="272" y1="152" x2="516" y2="152" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="395" y="144" text-anchor="middle" font-size="13" fill="#111827">user.message</text>
  <line x1="518" y1="190" x2="274" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="405" y="210" text-anchor="middle" font-size="12.5" fill="#111827">turn ends: end_turn</text>
  <text x="405" y="228" text-anchor="middle" font-size="12.5" fill="#111827">user.interrupt (about 1 s): end_turn</text>
  <text x="405" y="246" text-anchor="middle" font-size="12.5" fill="#111827">spend cap reached: budget_reached</text>

  <!-- rescheduling -->
  <rect x="535" y="14" width="160" height="48" rx="24" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="615" y="35" text-anchor="middle" font-size="13" fill="#374151">rescheduling</text>
  <text x="615" y="52" text-anchor="middle" font-size="11" fill="#6b7280">transient error, retried</text>
  <line x1="603" y1="126" x2="603" y2="66" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="627" y1="66" x2="627" y2="126" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- refused while running -->
  <line x1="712" y1="170" x2="750" y2="170" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="758" y="158" font-size="12" fill="#b91c1c">delete or archive is</text>
  <text x="758" y="175" font-size="12" fill="#b91c1c">refused (400) while running:</text>
  <text x="758" y="192" font-size="12" fill="#b91c1c">interrupt first</text>

  <!-- end states -->
  <rect x="30" y="330" width="220" height="72" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="140" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">terminated</text>
  <text x="140" y="376" text-anchor="middle" font-size="12" fill="#374151">archived: history readable,</text>
  <text x="140" y="392" text-anchor="middle" font-size="12" fill="#374151">new events refused</text>
  <line x1="120" y1="212" x2="120" y2="326" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="128" y="276" font-size="13" fill="#111827">archive</text>
  <text x="128" y="293" font-size="11.5" fill="#374151">(idle only; not used</text>
  <text x="128" y="308" font-size="11.5" fill="#374151">in this lab)</text>

  <rect x="440" y="330" width="230" height="72" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="555" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">deleted (404)</text>
  <text x="555" y="376" text-anchor="middle" font-size="12" fill="#991b1b">history, sandbox, and outputs</text>
  <text x="555" y="392" text-anchor="middle" font-size="12" fill="#991b1b">are gone for good</text>
  <line x1="195" y1="212" x2="440" y2="326" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="425" y="288" font-size="13" fill="#111827">delete</text>
  <text x="425" y="304" font-size="11.5" fill="#374151">(what this lab does)</text>
  <line x1="252" y1="372" x2="436" y2="372" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="320" y="364" font-size="13" fill="#111827">delete</text>

  <!-- notes -->
  <text x="700" y="300" font-size="12.5" font-weight="700" fill="#374151">A finished turn is idle,</text>
  <text x="700" y="318" font-size="12.5" font-weight="700" fill="#374151">not terminated.</text>
  <text x="700" y="342" font-size="12.5" fill="#374151">Idle costs no runtime, but the</text>
  <text x="700" y="360" font-size="12.5" fill="#374151">session, its history, and its</text>
  <text x="700" y="378" font-size="12.5" fill="#374151">sandbox remain until you</text>
  <text x="700" y="396" font-size="12.5" fill="#374151">delete it.</text>
</svg>
